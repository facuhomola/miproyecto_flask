{% extends "layout.html" %}

{% block titulo %}
Alta de estudiante
{% endblock %}

{% block contenido %}

<section class="formulario-seccion">

    <h2>Alta de estudiante</h2>

    <p>Complete los datos del nuevo estudiante.</p>

    <form method="POST" class="formulario">

        <div class="campo">
            <label for="nro">Número de registro:</label>
            <input type="number" id="nro" name="nro" required>
        </div>

        <div class="campo">
            <label for="nombre_apellido">Nombre y apellido:</label>
            <input type="text" id="nombre_apellido" name="nombre_apellido" required>
        </div>

        <div class="campo">
            <label for="dni">DNI:</label>
            <input type="number" id="dni" name="dni" required>
        </div>

        <button type="submit" class="boton">
            Guardar estudiante
        </button>

    </form>

    <a href="{{ url_for('estudiantes') }}" class="volver">
        ← Volver a estudiantes
    </a>

</section>

{% endblock %}
