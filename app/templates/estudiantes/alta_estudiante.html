{% extends "layout.html" %}

{% block title %}Alta de estudiante{% endblock %}

{% block contenido %}

<h1>Alta de estudiante</h1>

<form method="POST">

    <label for="nro">Número de registro:</label>
    <input type="number" id="nro" name="nro" required>

    <br><br>

    <label for="nombre_apellido">Nombre y apellido:</label>
    <input type="text" id="nombre_apellido" name="nombre_apellido" required>

    <br><br>

    <label for="dni">DNI:</label>
    <input type="number" id="dni" name="dni" required>

    <br><br>

    <button type="submit">Guardar estudiante</button>

</form>

{% endblock %}
