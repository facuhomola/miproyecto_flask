<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión - Sistema de Calificaciones</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 420px;
            background-color: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.10);
        }

        .encabezado {
            text-align: center;
            margin-bottom: 30px;
        }

        .encabezado h1 {
            color: #1d3557;
            font-size: 25px;
            margin-bottom: 10px;
        }

        .encabezado h2 {
            color: #555;
            font-size: 16px;
            font-weight: normal;
            line-height: 1.5;
        }

        .titulo-login {
            text-align: center;
            color: #333;
            font-size: 20px;
            margin-bottom: 25px;
        }

        .campo {
            margin-bottom: 20px;
        }

        .campo label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }

        .campo input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 15px;
        }

        .campo input:focus {
            outline: none;
            border-color: #1d3557;
        }

        button {
            width: 100%;
            padding: 13px;
            background-color: #1d3557;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }

        button:hover {
            background-color: #274c77;
        }

        .mensaje {
            background-color: #fce8e6;
            color: #a12622;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
        }

    </style>

</head>

<body>

    <div class="contenedor">

        <div class="encabezado">

            <h1>Sistema de Calificaciones</h1>

            <h2>
                Colegio N.º 13<br>
                Profesor Roberto Moyano
            </h2>

        </div>

        <h3 class="titulo-login">Iniciar sesión</h3>

        {% with mensajes = get_flashed_messages() %}
            {% if mensajes %}
                {% for mensaje in mensajes %}
                    <p class="mensaje">{{ mensaje }}</p>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST" action="{{ url_for('login') }}">

            <div class="campo">

                <label for="nombre_de_usuario">
                    Nombre de usuario
                </label>

                <input
                    type="text"
                    id="nombre_de_usuario"
                    name="nombre_de_usuario"
                    required
                    autocomplete="username"
                >

            </div>

            <div class="campo">

                <label for="contrasenia">
                    Contraseña
                </label>

                <input
                    type="password"
                    id="contrasenia"
                    name="contrasenia"
                    required
                    autocomplete="current-password"
                >

            </div>

            <button type="submit">Ingresar</button>

        </form>

    </div>

</body>
</html>
