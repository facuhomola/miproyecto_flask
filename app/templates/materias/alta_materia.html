{% extends "layout.html" %}

{% block titulo %}
Alta de materia
{% endblock %}

{% block contenido %}

<section class="formulario-seccion">

    <h2>Alta de materia</h2>

    <p>Complete los datos de la nueva materia.</p>

    <form method="POST" class="formulario">

        <div class="campo">
            <label for="curso">Curso:</label>

            <select id="curso" name="curso" required>
                <option value="">Seleccione un curso</option>
                {% for numero in range(1, 7) %}
                    <option value="{{ numero }}">
                        {{ numero }}° año
                    </option>
                {% endfor %}
            </select>
        </div>

        <div class="campo">
            <label for="id_grupo">Turno y división:</label>

            <select id="id_grupo" name="id_grupo" required>
                <option value="">Seleccione turno y división</option>

                {% for grupo in grupos %}
                    <option
                        value="{{ grupo[0] }}"
                        data-curso="{{ grupo[1] }}"
                    >
                        {{ grupo[2]|capitalize }} - División {{ grupo[3] }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <div class="campo">
            <label for="nombre_materia">Nombre de la materia:</label>

            <input
                type="text"
                id="nombre_materia"
                name="nombre_materia"
                required
            >
        </div>

        <div class="campo">
            <label for="id_usuario">Docente responsable:</label>

            <select id="id_usuario" name="id_usuario" required>
                <option value="">Seleccione un docente</option>

                {% for docente in docentes %}
                    <option value="{{ docente[0] }}">
                        {{ docente[1] }}
                    </option>
                {% endfor %}

            </select>
        </div>

        <button type="submit" class="boton">
            Guardar materia
        </button>

    </form>

    <a href="{{ url_for('materias') }}" class="volver">
        ← Volver a materias
    </a>

</section>

<script>
    const selectorCurso = document.getElementById("curso");
    const selectorGrupo = document.getElementById("id_grupo");

    function filtrarGrupos() {

        const cursoSeleccionado = selectorCurso.value;

        selectorGrupo.value = "";

        for (const opcion of selectorGrupo.options) {

            if (opcion.value === "") {
                continue;
            }

            opcion.hidden = (
                opcion.dataset.curso !== cursoSeleccionado
            );
        }
    }

    selectorCurso.addEventListener("change", filtrarGrupos);
</script>

{% endblock %}
